<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08060c" />
    <meta name="description" content="X Group activity passport, WhatsApp booking and locations for X Entertainment RAK Mall and Masters Bowling." />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://cfaxlqlbjyffmkxvddhy.supabase.co; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; style-src 'self'; style-src-attr 'none'; script-src 'self'; script-src-attr 'none'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests;" />
    <script src="src/language-boot.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>X Group Activity Passport</title>
  </head>
  <body>
    <a class="skip-link" href="#app" data-i18n="skip.content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="#/passport" aria-label="Open X Group Passport" data-i18n-aria="brand.open">
        <img class="brand-logo" src="assets/x-group-logo.jpg" alt="" width="100" height="102" />
        <span class="brand-copy"><strong>X Group</strong><span data-i18n="brand.subtitle">Activity Passport</span></span>
      </a>
      <div class="header-actions">
        <nav aria-label="Primary navigation" data-i18n-aria="nav.primary">
          <button class="nav-link" data-route="passport" data-i18n="nav.passport">Passport</button>
          <button class="nav-link" data-route="book" data-i18n="nav.book">Book</button>
          <button class="nav-link" data-route="join" data-i18n="nav.join">Join</button>
        </nav>
        <button id="language-toggle" class="language-toggle" type="button" aria-label="Switch to Arabic" title="Switch to Arabic"><span aria-hidden="true">文</span><span data-language-label>العربية</span></button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer>
      <div><strong>X Group</strong><span data-i18n="footer.tagline">Entertainment experiences across Ras Al Khaimah</span></div>
      <div class="footer-links"><button class="text-button" data-route="book" data-i18n="footer.locations">Locations & booking</button><a href="https://xgroup.ae/" target="_blank" rel="noreferrer">xgroup.ae</a><button class="text-button" data-route="privacy" data-i18n="footer.privacy">Privacy</button></div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="src/vendor/jsQR.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
